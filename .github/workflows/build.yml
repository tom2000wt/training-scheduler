name: Build Installers

on:
  push:
    branches: [master]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: exe
          - os: macos-latest
            target: aarch64-apple-darwin
            ext: dmg

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install npm dependencies
        run: npm ci

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@latest

      - name: Build frontend
        run: npm run build

      - name: Build Tauri app
        run: cargo tauri build --target ${{ matrix.target }}

      - name: Find built files (Windows)
        if: matrix.os == 'windows-latest'
        run: find src-tauri/target -name "*.exe" -path "*/bundle/*" 2>/dev/null || true

      - name: Find built files (macOS)
        if: matrix.os == 'macos-latest'
        run: find src-tauri/target -name "*.dmg" -path "*/bundle/*" 2>/dev/null || true

      - name: Upload Windows installer
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: src-tauri/target/**/bundle/nsis/*.exe

      - name: Upload macOS installer
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: macos-installer
          path: src-tauri/target/**/bundle/dmg/*.dmg
