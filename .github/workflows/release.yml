name: Create Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install npm dependencies
        run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "南老师的课程管理系统 v__VERSION__"
          releaseBody: |
            ## 南老师的课程管理系统

            自动构建安装包。

            - **Windows**: `.exe` NSIS 安装程序
            - **macOS**: `.dmg` 磁盘映像

            双击即可一键安装，纯本地运行，无需联网。
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }}
